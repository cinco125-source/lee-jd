  summary: >
    Data-driven GNC researcher working across the full life cycle of unmanned aerospace
    systems — from fault-tolerant control of eVTOL/multirotor platforms to
    quantum-magnetometer-based navigation for GNSS-denied and defense applications.
    Ph.D. dissertation awarded the KAIST College of Engineering Best Dissertation Award (2026).

