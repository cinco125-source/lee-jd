    Experience:
      - company: KAIST — AITA InnoCORE Program, Dept. of Aerospace Engineering
        position: Postdoctoral Researcher
        location: Daejeon, Korea
        start_date: 2025-09
        summary: "Lead researcher on AI-based fault-tolerant control and quantum-magnetometer-aided navigation (MagNav) for eVTOL and unmanned aerial systems (advisor: Prof. Hyochoong Bang)."
        highlights:
          - Mentor graduate and undergraduate students on disturbance-observer design, data-driven system identification, and drone-based aeromagnetic surveys.
          - Coordinate flight-test campaigns integrating VN-200 INS, ZED-F9P RTK-GPS, and magnetometer payloads for GNSS-denied navigation.
      - company: AI Research Center, Hanyoung Nux Co., Ltd.
        position: AI Research Engineer (concurrent with graduate studies)
        location: Korea
        start_date: 2021-04
        end_date: 2024-02
        highlights:
          - Designed industrial temperature-controller algorithms combining classical PID tuning with data-driven adaptation.
          - Delivered productized control modules for the company's instrument line.

